name: Build and Test .NET 9

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore app
        run: dotnet restore StrategicPlanningDashboard.csproj
      - name: Restore tests
        run: dotnet restore tests/StrategicPlanningDashboard.Tests/StrategicPlanningDashboard.Tests.csproj
      - name: Build app
        run: dotnet build StrategicPlanningDashboard.csproj -c Release --no-restore
      - name: Unit and persistence tests
        run: dotnet test tests/StrategicPlanningDashboard.Tests/StrategicPlanningDashboard.Tests.csproj -c Release --no-restore --logger "console;verbosity=normal"
